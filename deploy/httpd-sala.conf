# ---------------------------------------------------------------------
# Sala de Tela — compartilhamento de tela + chat (WebRTC)
#
# Arquivos estaticos : C:/xampp/htdocs/sala
# Sinalizacao (WS)   : encaminhada para o Node em 127.0.0.1:8090
#
# URL publica: https://survivorsstrugglepve.com.br/sala/
# ---------------------------------------------------------------------

# WebSocket da sinalizacao (precisa de mod_proxy + mod_proxy_wstunnel)
ProxyPass        "/sala/ws" "ws://127.0.0.1:8090/ws"
ProxyPassReverse "/sala/ws" "ws://127.0.0.1:8090/ws"

# Configuracao de ICE/STUN/TURN vinda do servidor Node
ProxyPass        "/sala/config.json" "http://127.0.0.1:8090/config.json"
ProxyPassReverse "/sala/config.json" "http://127.0.0.1:8090/config.json"

# Agente de suporte remoto: download do .bat e WebSocket do agente.
# A regra do .bat vem antes porque "/sala/agente" tambem casaria com ela.
ProxyPass        "/sala/agente.bat" "http://127.0.0.1:8090/agente.bat"
ProxyPassReverse "/sala/agente.bat" "http://127.0.0.1:8090/agente.bat"
ProxyPass        "/sala/agente" "ws://127.0.0.1:8090/agente"
ProxyPassReverse "/sala/agente" "ws://127.0.0.1:8090/agente"

# Abrir o navegador sem aceleração de hardware (PC com tela preta)
ProxyPass        "/sala/navegador.bat" "http://127.0.0.1:8090/navegador.bat"
ProxyPassReverse "/sala/navegador.bat" "http://127.0.0.1:8090/navegador.bat"

<Directory "C:/xampp/htdocs/sala">
    Options -Indexes
    AllowOverride None
    Require all granted
    # o app usa WebSocket; nao deixar cache em cima do HTML/JS
    <IfModule mod_headers.c>
        Header set Cache-Control "no-cache"
    </IfModule>
</Directory>
