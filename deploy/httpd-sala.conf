# ---------------------------------------------------------------------
# Sala de Tela — compartilhamento de tela + chat (WebRTC)
#
# Arquivos estaticos : C:/xampp/htdocs/sala
# Sinalizacao (WS)   : encaminhada para o Node em 127.0.0.1:8090
#
# URL publica: https://survivorsstrugglepve.com.br/sala/
# ---------------------------------------------------------------------

# WebSocket da sinalizacao (precisa de mod_proxy + mod_proxy_wstunnel)
ProxyPass        "/sala/ws" "ws://127.0.0.1:8090/ws"
ProxyPassReverse "/sala/ws" "ws://127.0.0.1:8090/ws"

# Configuracao de ICE/STUN/TURN vinda do servidor Node
ProxyPass        "/sala/config.json" "http://127.0.0.1:8090/config.json"
ProxyPassReverse "/sala/config.json" "http://127.0.0.1:8090/config.json"

<Directory "C:/xampp/htdocs/sala">
    Options -Indexes
    AllowOverride None
    Require all granted
    # o app usa WebSocket; nao deixar cache em cima do HTML/JS
    <IfModule mod_headers.c>
        Header set Cache-Control "no-cache"
    </IfModule>
</Directory>
